wuji_trigger_hand:
  ros__parameters:
    buttons_topic: /quest3/buttons

    # Hysteresis prevents analog trigger noise from producing extra toggle edges.
    press_threshold: 0.65
    release_threshold: 0.35

    # Release a closed hand if Quest button messages stop arriving.
    buttons_timeout_sec: 0.5
    watchdog_rate_hz: 10.0
    release_on_startup: true
    release_on_timeout: true
    release_on_shutdown: true
    shutdown_release_hold_sec: 0.5
    disable_on_shutdown: true
    dry_run: false
    # Linear interpolation between released_pose and closed_pose. With recorder
    # at 30 Hz, 0.5 s gives about 15 visible HDF5 samples across each open/close.
    trajectory_duration_sec: 0.5
    trajectory_rate_hz: 50.0
    publish_joint_states: true
    # target: publish the latest 20D command sent to Wuji; this is non-blocking
    # and keeps trigger response reliable. actual can block in the SDK on this
    # setup, so only use it for isolated debugging.
    joint_state_source: target
    joint_state_topic_prefix: /wuji
    joint_state_rate_hz: 30.0
    joint_state_read_timeout_sec: 0.03

    # Left-hand poses are calibrated but disabled by default. Enable explicitly
    # with left_wuji_enabled:=true when the left Wuji hand is connected.
    left_enabled: false
    left_pose_calibrated: true
    left_serial: 3566377E3533
    left_trigger_value_name: leftTrig
    left_trigger_button_name: LTr
    left_released_pose:
      [
        0.818, -0.075, -0.152, -0.176,
        0.563, -0.125, 0.046, 0.035,
        0.631, 0.092, -0.044, -0.132,
        0.592, 0.098, -0.037, -0.123,
        0.430, 0.153, 0.060, 0.090,
      ]
    left_closed_pose:
      [
        1.610, 0.898, -0.271, -0.246,
        0.915, -0.101, 0.483, 0.610,
        1.110, 0.092, 0.449, 0.348,
        1.127, 0.288, 0.492, 0.390,
        0.915, 0.356, 0.610, 0.407,
      ]

    right_enabled: true
    right_pose_calibrated: true
    right_serial: 3671354F3333
    right_trigger_value_name: rightTrig
    right_trigger_button_name: RTr
    right_released_pose:
      [
        1.001, -0.083, -0.059, -0.188,
        0.226, -0.114, -0.039, -0.028,
        0.439, -0.179, -0.043, -0.138,
        0.402, -0.143, -0.030, -0.098,
        0.223, -0.204, 0.060, 0.338,
      ]
    right_closed_pose:
      [
        1.6, 0.165, 0.150, -0.121,
        1.3, -0.27, 1.486, 1.274,
        0.638, -0.089, 0.968, 0.879,
        0.671, -0.179, 0.974, 0.931,
        0.626, 0.054, 1.286, 1.187,
      ]
