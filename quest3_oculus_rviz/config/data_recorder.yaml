quest3_data_recorder:
  ros__parameters:
    out_data_dir: /tmp/quest3_recordings
    recording_rate_hz: 30.0
    max_episode_sec: 600.0

    buttons_topic: /quest3/buttons
    start_button_analog: A
    stop_button_analog: B
    delete_button: X
    trigger_threshold: 0.5
    episode_saved_topic: /quest3/data_recorder/episode_saved
    # Voice prompts for recording lifecycle events. Uses the USB/default audio
    # output selected by the desktop audio system. Set enabled=false to mute.
    voice_announce_enabled: true
    # The default speech-dispatcher setup on this machine has no Chinese voice,
    # so keep these prompts ASCII/English to avoid "Chinese character" readouts.
    voice_command: spd-say -l en
    voice_start_text: Recording started
    voice_stop_text: Recording stopped
    voice_delete_text: Data deleted

    require_cameras: true
    image_width: 1280
    image_height: 720
    image_fps: 30
    image_fourcc: MJPG
    # jpeg: write compressed MJPEG/JPEG bytes directly from V4L2 to HDF5.
    # raw: old OpenCV path, decodes frames to BGR arrays before saving.
    image_storage: jpeg
    warmup_frames: 10

    # Wuji dexterous hand recording. Scheme B uses the official wujihandros2
    # driver: command targets come from /hand_*/joint_commands, measured/current
    # positions come from /hand_*/joint_states.
    record_hand_joint_positions: true
    record_hand_actual_joint_positions: true
    hand_joint_count: 20
    # Fish-eye (V4L2/UVC) cameras matched by usb_path or serial + stream_index.
    # These A031-PC2.1-ZC cameras all report the same USB serial (SN0001), so
    # serial cannot distinguish them on this machine. Use usb_path + stream_index.
    # Current index-0 video nodes:
    #   1-2.3 -> /dev/video6, 1-7.3 -> /dev/video2
    camera_names: ["l_right_camera", "r_left_camera"]
    l_right_camera:
      usb_path: "1-2.3"
      serial: ""
      stream_index: 0
    r_left_camera:
      usb_path: "1-7.3"
      serial: ""
      stream_index: 0
    arm_names: ["left", "right"]

    left:
      cmd_topic: /left/cartesian_impedance_controller/equilibrium_pose
      current_pose_topic: /left/franka_robot_state_broadcaster/current_pose
      gripper_joint_states_topic: /left/franka_gripper/joint_states
      hand_command_topic: /hand_left/joint_commands
      hand_actual_joint_states_topic: /hand_left/joint_states
      # Quest 侧键原始值取自 /quest3/buttons 的 leftGrip；该话题表示
      # 左臂摇操最终是否真正启用（错误/恢复期间会强制为 false）。
      enable_analog_name: leftGrip
      teleop_enabled_topic: /quest3/left_impedance_teleop/enabled
      wrench_topic: /left/franka_robot_state_broadcaster/external_wrench_in_stiffness_frame

    right:
      cmd_topic: /right/cartesian_impedance_controller/equilibrium_pose
      current_pose_topic: /right/franka_robot_state_broadcaster/current_pose
      gripper_joint_states_topic: /right/franka_gripper/joint_states
      hand_command_topic: /hand_right/joint_commands
      hand_actual_joint_states_topic: /hand_right/joint_states
      # Quest 侧键原始值取自 /quest3/buttons 的 rightGrip。
      enable_analog_name: rightGrip
      teleop_enabled_topic: /quest3/right_impedance_teleop/enabled
      wrench_topic: /right/franka_robot_state_broadcaster/external_wrench_in_stiffness_frame
