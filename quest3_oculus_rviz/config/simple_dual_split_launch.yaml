# 双臂启动参数 profile。
# 用法:
#   ros2 launch quest3_oculus_rviz simple_dual_all.launch.py
# 或:
#   ros2 launch quest3_oculus_rviz simple_dual_profile.launch.py profile:=all_in_one
#
# CPU 参数为空字符串时表示不绑核；填数字或范围时会通过 taskset 绑定，例如:
#   8      -> 只绑定 CPU 8
#   10,12  -> 绑定 CPU 10 和 12
#   10-11  -> 绑定 CPU 10 到 11

# 只启动左右 Franka 控制栈，不启动 Quest reader、摇操和 Wuji。
# 适合把 1 kHz 机械臂控制和上层 teleop 分成两个 launch 进程时使用。
franka_stack:
  # 左臂 Franka FCI IP。
  left_robot_ip: 172.16.0.2
  # 右臂 Franka FCI IP。
  right_robot_ip: 172.16.0.3
  # 机器人型号，FR3 使用 fr3。
  robot_type: fr3
  # 是否加载 Franka gripper；当前使用外部 Wuji 手时通常为 false。
  load_gripper: false
  # 是否启动 RViz。
  start_rviz: false
  # 双臂 TF 的基坐标系名称。
  base_frame: base
  # 是否启动左臂控制栈。
  start_left_arm: true
  # 是否启动右臂控制栈。
  start_right_arm: true
  # 是否启动 Quest 手柄/头显 TF reader；此 profile 只跑机械臂，所以为 false。
  start_quest_reader: false
  # 是否启动左手柄到左臂的摇操节点。
  start_left_teleop: false
  # 是否启动右手柄到右臂的摇操节点。
  start_right_teleop: false
  # 是否启动 Wuji trigger hand 节点。
  start_wuji_trigger_hand: false
  # 是否启动官方 wujihandros2 driver；Franka-only profile 不碰灵巧手硬件。
  start_wujihand_driver: false
  # 启动后是否自动 activate cartesian_impedance_controller。
  auto_start_impedance: true
  # 出现 reflex 后是否自动 recover；调试 reflex 原因时建议 false，避免掩盖首次错误。
  auto_recover_after_reflex: true
  # 左臂 ros2_control_node 绑定的 CPU，负责实时控制主循环，最关键。
  left_ros2_control_cpu: 2
  # 左臂 Franka 辅助节点绑定 CPU，例如 robot_state_broadcaster、joint_state 等非主控制任务。
  left_franka_aux_cpu: 4
  # 左臂 HTTP server 绑定 CPU，负责 /getstate、/health 等 HTTP 接口。
  left_http_server_cpu: 6
  # 左臂 reflex watchdog 绑定 CPU，负责监听错误并按配置恢复。
  left_watchdog_cpu: 6
  # 右臂 ros2_control_node 绑定的 CPU，负责实时控制主循环，最关键。
  right_ros2_control_cpu: 8
  # 右臂 Franka 辅助节点绑定 CPU，例如 robot_state_broadcaster、joint_state 等非主控制任务。
  right_franka_aux_cpu: 10
  # 右臂 HTTP server 绑定 CPU，负责 /getstate、/health 等 HTTP 接口。
  right_http_server_cpu: 12
  # 右臂 reflex watchdog 绑定 CPU，负责监听错误并按配置恢复。
  right_watchdog_cpu: 12

# 扩散策略推理专用: 启动左右 Franka、官方 Wuji driver 和 HTTP 策略桥，
# 不启动 Quest、摇操或数据采集，避免其他节点覆盖策略目标。
policy_inference:
  left_robot_ip: 172.16.0.2
  right_robot_ip: 172.16.0.3
  robot_type: fr3
  load_gripper: false
  start_rviz: false
  base_frame: base
  start_left_arm: true
  start_right_arm: true
  start_quest_reader: false
  start_left_teleop: false
  start_right_teleop: false
  start_data_recorder: false
  start_wuji_trigger_hand: true
  start_wujihand_driver: true
  wuji_control_mode: service
  left_wuji_enabled: true
  right_wuji_enabled: true
  left_wuji_serial: 3566377E3533
  right_wuji_serial: 3671354F3333
  wuji_dry_run: false
  wujihand_state_rate: 200.0
  auto_start_impedance: true
  auto_recover_after_reflex: true
  left_server_port: 5000
  right_server_port: 5001
  left_ros2_control_cpu: 2
  left_franka_aux_cpu: 4
  left_http_server_cpu: 6
  left_watchdog_cpu: 6
  right_ros2_control_cpu: 8
  right_franka_aux_cpu: 10
  right_http_server_cpu: 12
  right_watchdog_cpu: 12
  wuji_cpu: 20
  left_wujihand_driver_cpu: 24
  right_wujihand_driver_cpu: 25

# 只启动 Quest reader、左右摇操节点和 Wuji，不重复启动 Franka 控制栈。
# 使用这个 profile 前，需要先用 franka_stack 把左右 Franka 控制栈启动起来。
quest_teleop:
  # 不启动左臂控制栈，避免和 franka_stack 重复启动。
  start_left_arm: false
  # 不启动右臂控制栈，避免和 franka_stack 重复启动。
  start_right_arm: false
  # 启动 Quest reader，发布手柄和头显 TF/按钮输入。
  start_quest_reader: true
  # 启动左手柄控制左臂的摇操节点。
  start_left_teleop: true
  # 启动右手柄控制右臂的摇操节点。
  start_right_teleop: true
  # 启动 Wuji trigger hand 节点。
  start_wuji_trigger_hand: true
  # 启动官方 wujihandros2 driver，发布 /hand_left/right/joint_states 并接收 joint_commands。
  start_wujihand_driver: true
  # 是否启用左 Wuji 手。
  left_wuji_enabled: true
  # 是否启用右 Wuji 手；右手不接或暂时不用时设为 false。
  right_wuji_enabled: true
  # 左 Wuji 手 USB 序列号，用于自动匹配正确串口。
  left_wuji_serial: 3566377E3533
  # 右 Wuji 手 USB 序列号，用于自动匹配正确串口。
  right_wuji_serial: 3671354F3333
  # true 表示只打印命令不真实发送给 Wuji 硬件，调试用。
  wuji_dry_run: false
  # 官方 Wuji driver 的当前关节状态发布频率，单位 Hz。
  wujihand_state_rate: 200.0
  # 是否启动双臂 HDF5 数据采集节点（依赖 Quest 按钮和鱼眼相机，属于 teleop 侧）。
  start_data_recorder: true
  # 数据采集时若相机缺失则报错退出；不接相机纯摇操时设为 false。
  require_cameras: true
  # 采集数据输出目录。
  out_data_dir: "/home/lumos/quest3_recordings"
  # Quest reader 绑定 CPU。
  quest_reader_cpu: 14
  # 左摇操节点绑定 CPU。
  left_teleop_cpu: 16
  # 右摇操节点绑定 CPU。
  right_teleop_cpu: 18
  # Wuji trigger hand 节点绑定 CPU。
  wuji_cpu: 20
  # 左 Wuji 官方 driver 绑定 CPU。
  left_wujihand_driver_cpu: 24
  # 数据采集节点绑定 CPU。
  data_recorder_cpu: 22
  # 右 Wuji 官方 driver 绑定 CPU。
  right_wujihand_driver_cpu: 25

# 一条命令启动全部节点: 左右 Franka 控制栈 + Quest reader + 左右摇操 + Wuji。
# 这是最方便的入口；如果还出现 reflex 干扰，再改用 franka_stack + quest_teleop 双终端方式隔离。
