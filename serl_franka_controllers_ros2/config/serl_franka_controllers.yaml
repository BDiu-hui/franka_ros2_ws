/**:
  controller_manager:
    ros__parameters:
      update_rate: 1000

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      franka_robot_state_broadcaster:
        type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
        state_interfaces:
          robot_state

      joint_position_controller:
        type: serl_franka_controllers_ros2/JointPositionController

      cartesian_pose_command_controller:
        type: serl_franka_controllers_ros2/CartesianPoseCommandController

      cartesian_impedance_controller:
        type: serl_franka_controllers_ros2/CartesianImpedanceController

      fr3_arm_controller:
        type: joint_trajectory_controller/JointTrajectoryController

  franka_robot_state_broadcaster:
    ros__parameters:
      lock_try_count: 5
      lock_sleep_interval: 5
      lock_log_error: false
      lock_update_success: true

  joint_position_controller:
    ros__parameters:
      joint_names:
        - fr3_joint1
        - fr3_joint2
        - fr3_joint3
        - fr3_joint4
        - fr3_joint5
        - fr3_joint6
        - fr3_joint7
      target_joint_positions:
        - 0.0
        - -0.78539816339
        - 0.0
        - -2.35619449019
        - 0.0
        - 1.57079632679
        - 0.78539816339
      trajectory_duration: 20.0

  cartesian_impedance_controller:
    ros__parameters:
      arm_id: fr3
      robot_type: fr3
      arm_prefix: ""
      joint_names:
        - fr3_joint1
        - fr3_joint2
        - fr3_joint3
        - fr3_joint4
        - fr3_joint5
        - fr3_joint6
        - fr3_joint7
      translational_stiffness: 2600.000000
      translational_damping: 170.000000
      rotational_stiffness: 550.000000
      rotational_damping: 4.500000
      # nullspace_stiffness: 0.2
      nullspace_stiffness: 0.500000
      joint1_nullspace_stiffness: 100.000000
      # translational_clip_neg_x: 0.01
      # translational_clip_neg_y: 0.01
      # translational_clip_neg_z: 0.01
      # translational_clip_x: 0.01
      # translational_clip_y: 0.01
      # translational_clip_z: 0.01
      translational_clip_neg_x: 0.100000
      translational_clip_neg_y: 0.100000
      translational_clip_neg_z: 0.100000
      translational_clip_x: 0.100000
      translational_clip_y: 0.100000
      translational_clip_z: 0.100000
      rotational_clip_neg_x: 0.300000
      rotational_clip_neg_y: 0.300000
      rotational_clip_neg_z: 0.300000
      rotational_clip_x: 0.300000
      rotational_clip_y: 0.300000
      rotational_clip_z: 0.300000
      translational_ki: 50.0
      rotational_ki: 5.0
      # filter_params: 0.005
      filter_params: 0.20000

  cartesian_pose_command_controller:
    ros__parameters:
      robot_type: fr3
      arm_prefix: ""
      max_linear_velocity: 0.02
      max_angular_velocity: 0.2

  fr3_arm_controller:
    ros__parameters:
      command_interfaces:
        - effort
      state_interfaces:
        - position
        - velocity
      joints:
        - fr3_joint1
        - fr3_joint2
        - fr3_joint3
        - fr3_joint4
        - fr3_joint5
        - fr3_joint6
        - fr3_joint7
      gains:
        fr3_joint1: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
        fr3_joint2: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
        fr3_joint3: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
        fr3_joint4: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
        fr3_joint5: {p: 250.0, d: 10.0, i: 0.0, i_clamp: 1.0}
        fr3_joint6: {p: 150.0, d: 10.0, i: 0.0, i_clamp: 1.0}
        fr3_joint7: {p: 50.0, d: 5.0, i: 0.0, i_clamp: 1.0}
